<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Dashboard | Excellence University</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <main class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-top">
        <div class="admin-logo-block">
          <img src="{{ url_for('static', filename='images/school-logo.png') }}" alt="Excellence University Logo"
            class="admin-logo" />
        </div>

        <div class="admin-user-card">
          <div class="admin-user-info-only">
            <strong id="displayName">Loading...</strong>
            <p id="displayRole">Loading...</p>
          </div>
        </div>

        <nav class="admin-sidebar-nav" aria-label="Admin navigation">
          <a href="#" class="active">Dashboard</a>
          <a href="#">FAQ Management</a>

          <a href="{{ url_for('login') }}" class="admin-logout-link">
            <span class="logout-icon">⇦</span>
            <span>Log Out</span>
          </a>
        </nav>
      </div>
    </aside>

    <section class="admin-main" aria-labelledby="adminDashboardTitle">
      <div class="admin-header">
        <h1 id="adminDashboardTitle">Admin Dashboard</h1>
      </div>

      <div class="admin-summary-cards">
        <div class="admin-summary-card">
          <h3>Total FAQs</h3>
          <strong id="totalFaqCount">0</strong>
          <span>Published knowledge entries</span>
        </div>
      </div>

      <div class="admin-search-bar">
        <input type="search" id="faqSearchInput" placeholder="Search for FAQs"
          aria-label="Search administrative items" />
      </div>

      <div class="admin-panel">
        <div class="admin-panel-header admin-table-toolbar">
          <div>
            <h2>FAQ Management</h2>
            <p class="admin-panel-subtext">Manage chatbot FAQ answers by intent.</p>
          </div>

          <div class="admin-item-actions">
            <button type="button" id="addFaqBtn" class="admin-primary-btn">Add FAQ</button>
            <button type="button" id="refreshFaqBtn" class="admin-secondary-btn">Refresh</button>
          </div>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-faq-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Display Name</th>
                <th>Summary</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="faqTableBody">
              <tr>
                <td colspan="4">No FAQs found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="faq-modal-backdrop" id="faqModalBackdrop" hidden></div>

      <div class="faq-modal" id="faqModal" role="dialog" aria-modal="true" aria-labelledby="faqModalTitle" hidden>
        <div class="faq-modal-content">
          <div class="faq-modal-header">
            <h3 id="faqModalTitle" tabindex="-1">Add FAQ</h3>
            <button type="button" class="faq-modal-close" id="closeFaqModalBtn" aria-label="Close FAQ form">
              ×
            </button>
          </div>

          <form id="faqForm" class="faq-form">
            <input type="hidden" id="faqId" />

            <div class="form-group">
              <label for="faqDisplayName">
                Display Name <span class="required-asterisk" aria-hidden="true">*</span>
              </label>
              <input type="text" id="faqDisplayName" placeholder="e.g. Graduation Requirements" required
                aria-required="true" />
            </div>

            <div class="form-group">
              <label for="faqIntent">
                Intent Name <span class="required-asterisk" aria-hidden="true">*</span>
              </label>
              <input type="text" id="faqIntent" placeholder="e.g. ask_graduation_requirements" required
                aria-required="true" />
            </div>

            <div class="form-group">
              <label for="faqTrainingPhrases">
                Training Phrases <span class="required-asterisk" aria-hidden="true">*</span>
              </label>
              <textarea id="faqTrainingPhrases" rows="6" placeholder="Enter one training phrase per line" required
                aria-required="true"></textarea>
            </div>

            <div class="form-group">
              <label for="faqAnswer">
                Answer <span class="required-asterisk" aria-hidden="true">*</span>
              </label>
              <textarea id="faqAnswer" rows="5" placeholder="Short main answer shown to users" required
                aria-required="true"></textarea>
            </div>

            <div class="form-group">
              <label for="faqSummary">Summary</label>
              <textarea id="faqSummary" rows="3"
                placeholder="Short summary for the FAQ table or chatbot preview"></textarea>
            </div>

            <div class="form-group">
              <label for="faqDetails">Details</label>
              <textarea id="faqDetails" rows="5" placeholder="Extra explanation or supporting details"></textarea>
            </div>

            <div class="form-group">
              <label for="faqSteps">Steps</label>
              <textarea id="faqSteps" rows="4"
                placeholder="Enter one step per line&#10;e.g.&#10;Log in to the student portal&#10;Open the graduation section&#10;Submit your application"></textarea>

            </div>

            <div class="form-group">
              <label for="faqRelatedTopics">Related Topics</label>
              <textarea id="faqRelatedTopics" rows="4"
                placeholder="Enter one related topic per line&#10;e.g.&#10;ask_admission_info&#10;ask_course_transfer"></textarea>

            </div>

            <div class="form-group">
              <label for="faqLinks">Links</label>
              <textarea id="faqLinks" rows="4"
                placeholder="Enter one link per line&#10;e.g.&#10;Graduation Guide | https://example.com/graduation&#10;Portal | https://example.com/portal"></textarea>
            </div>

            <div class="admin-item-actions">
              <button type="submit" class="admin-primary-btn">Save FAQ</button>
              <button type="button" id="cancelFaqModalBtn" class="admin-secondary-btn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="{{ url_for('static', filename='js/supabase-config.js') }}"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

  <script src="{{ url_for('static', filename='js/auth-guard.js') }}"></script>
  <script src="{{ url_for('static', filename='js/logout.js') }}"></script>
  <script src="{{ url_for('static', filename='js/faqmanage.js') }}"></script>


  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await guardDashboard("admin", "System Administrator");
      bindLogout([".admin-logout-link"]);
    });

  </script>
</body>

</html>
